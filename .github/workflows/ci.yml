name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # NumPy of environment.yml; SciPy 1.18 has no Python 3.11 build.  The
          # golden tolerances absorb the remaining build differences.
          pip install numpy==2.4.6 scipy==1.17.1 matplotlib==3.10.3 pillow==11.2.1 PyYAML==6.0.2 'setuptools>=77'
      - name: Tests (includes the golden trajectories)
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -t . -v

  gui:
    # The --gui launcher and live view, on Qt's offscreen platform.  The main
    # job skips these tests because it installs no Qt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for PyQt6 offscreen rendering
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.4.6 scipy==1.17.1 matplotlib==3.10.3 pillow==11.2.1 PyYAML==6.0.2 'setuptools>=77'
          pip install pyqtgraph==0.13.7 PyOpenGL==3.1.9 PyQt6==6.9.1
      - name: Tests with the GUI (offscreen)
        env:
          MPLBACKEND: Agg
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v
